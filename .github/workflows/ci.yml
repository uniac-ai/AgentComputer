name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Install the headless browser
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Lint
        run: npm run check
      - name: Generated code matches the schema
        run: |
          npm run generate
          git diff --exit-code packages/contract/src/generated
      - name: Build and test
        run: |
          export AGENTCOMPUTER_BROWSER_PATH="$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-*/*/chrome-headless-shell)"
          # Without it the browser tests would be skipped, not run.
          test -x "$AGENTCOMPUTER_BROWSER_PATH"
          npm run build
          docker build -t agentcomputer-computer:test .
          docker build -f Dockerfile.service -t agentcomputer-service:test .
          # A Linux desktop with the pinned Cua Driver, for the screen's tests.
          docker build -f test/fixtures/screen.Dockerfile -t agentcomputer-screen:test test/fixtures
          export AGENTCOMPUTER_TEST_IMAGE=agentcomputer-computer:test
          export AGENTCOMPUTER_TEST_SERVICE_IMAGE=agentcomputer-service:test
          export AGENTCOMPUTER_TEST_SCREEN_IMAGE=agentcomputer-screen:test
          npm test

  # AgentExec, in packages/exec, through its own suite, which reaches it from a Python MCP client
  # too. The lint above covers it.
  exec:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install
        run: npm ci
      - name: Install the Python MCP client
        run: pip install -r packages/exec/requirements-test.txt
      - name: Build and test
        run: npm test --workspace @agentorg/exec

  # The Mac app's side that runs anywhere: its assembly's, brand and version tests, over stand-ins,
  # and its window's page, built and driven in a browser. Its Rust and its bundle are the Mac job's.
  mac-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install the headless browser for the page's tests
        run: npx playwright install --only-shell chromium
      - name: The app's tests
        run: npm test --workspace @agentorg/mac
      - name: The window's page, built and tested
        run: |
          npm run build --workspace @agentorg/mac-window
          npm test --workspace @agentorg/mac-window

  # The browser host on macOS, where a user's temporary folder is long enough to matter.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install the headless browser
        run: npx playwright-core install --only-shell chromium
      - name: Build and test the browser
        run: |
          export AGENTCOMPUTER_BROWSER_PATH="$(ls -d ~/Library/Caches/ms-playwright/chromium_headless_shell-*/*/chrome-headless-shell)"
          # Without it the browser tests would be skipped, not run.
          test -x "$AGENTCOMPUTER_BROWSER_PATH"
          npm run build
          node --test --test-timeout=180000 out/test/browser-host.test.js out/test/browser-live.test.js
