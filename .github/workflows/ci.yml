name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Install the headless browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Lint
        run: npm run check
      - name: Generated code matches the schema
        run: |
          npm run generate
          git diff --exit-code src/generated
      - name: Build and test
        run: |
          export AGENTCOMPUTER_BROWSER_PATH="$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-*/*/chrome-headless-shell)"
          npm run build
          docker build -t agentcomputer-computer:test .
          docker build -f Dockerfile.service -t agentcomputer-service:test .
          export AGENTCOMPUTER_TEST_IMAGE=agentcomputer-computer:test
          export AGENTCOMPUTER_TEST_SERVICE_IMAGE=agentcomputer-service:test
          npm test
