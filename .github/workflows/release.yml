name: Release

# Publishes @agentorg/computer to npm through Trusted Publishing: npm trusts this workflow, in the `npm`
# environment, by its OIDC identity, so no token is stored anywhere, and the package carries a
# provenance statement linking it to this repository and commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No Actions cache: a release installs only from the lockfile, never from a cache that
      # other workflow runs can write.
      - name: Install
        run: npm ci
      - name: Install the headless browser
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Build and test
        run: |
          export AGENTCOMPUTER_BROWSER_PATH="$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-*/*/chrome-headless-shell)"
          # Without it the browser tests would be skipped, not run.
          test -x "$AGENTCOMPUTER_BROWSER_PATH"
          npm test
      - name: Check that the tag names the package's version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      # npm passes over publishConfig.tag in a tarball's package.json, so it is read here.
      - id: tag
        run: echo "tag=$(node -p 'require("./package.json").publishConfig?.tag ?? "latest"')" >> "$GITHUB_OUTPUT"
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: agentorg-computer-*.tgz

  # Before the package, whose default computer image this is.
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build what the image copies
        run: |
          npm ci
          npm run build
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/uniac-ai/agentcomputer/computer:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/uniac-ai/AgentComputer
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/uniac-ai/agentcomputer/service:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/uniac-ai/AgentComputer
            org.opencontainers.image.licenses=Apache-2.0

  publish:
    needs: [build, image]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish agentorg-computer-*.tgz --access public --provenance --tag "${{ needs.build.outputs.tag }}"
