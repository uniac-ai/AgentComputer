name: Release

# Publishes @agentorg/computer, the program, and @agentorg/computer-sdk, its SDK alone, to npm through
# Trusted Publishing: npm trusts this workflow, in the `npm` environment, by its OIDC identity, so no
# token is stored anywhere, and each package carries a provenance statement linking it to this
# repository and commit. Both are the tag's version, under the same npm tag.
#
# Before them, the two images, each attested, and the Mac app, built unsigned and zipped. Last, once
# npm has both packages, this run makes the tag's GitHub release, not marked Latest, with the
# release notes the tagged commit carries in release-notes/<tag>.md. The release carries the
# unsigned app and SHA256SUMS, each attested by this workflow at the tag. packages/mac/signing.json
# lists every Mach-O file of the app with its entitlements, for its signing; the signed app is added
# to the release later, with its own line appended to SHA256SUMS, and this run's lines stay as they
# are.
#
# What reads a release keeps to this file's name, its `vX.Y.Z` tags and the names of what it makes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No Actions cache: a release installs only from the lockfile, never from a cache that
      # other workflow runs can write.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      # The release this run makes at its end carries these notes: without them, nothing goes out.
      - name: Check the release notes
        run: test -s "release-notes/$GITHUB_REF_NAME.md"
      - name: Install
        run: npm ci
      - name: Install the headless browser
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Build and test
        run: |
          export AGENTCOMPUTER_BROWSER_PATH="$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-*/*/chrome-headless-shell)"
          # Without it the browser tests would be skipped, not run.
          test -x "$AGENTCOMPUTER_BROWSER_PATH"
          npm test
      # AgentExec, in packages/exec, built into the program: its own suite too, as CI runs it.
      - name: Test AgentExec
        run: |
          pip install -r packages/exec/requirements-test.txt
          npm test --workspace @agentorg/exec
      - name: Check that the tag names both packages' version
        run: |
          for package in . packages/sdk; do
            test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./$package/package.json').version")"
          done
      # npm passes over publishConfig.tag in a tarball's package.json, so it is read here, and both
      # packages must name the same one.
      - id: tag
        run: |
          tag="$(node -p 'require("./package.json").publishConfig?.tag ?? "latest"')"
          test "$tag" = "$(node -p 'require("./packages/sdk/package.json").publishConfig?.tag ?? "latest"')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Pack the program and the SDK
        run: |
          npm pack
          npm pack --workspace @agentorg/computer-sdk
          # The program's package exports the same SDK file as the SDK's own.
          cmp dist/sdk.js packages/sdk/dist/sdk.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: agentorg-computer-*.tgz

  # Before the package, whose default computer image this is. Each image is attested by this
  # workflow at the tag, the attestation pushed beside the image.
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build what the image copies
        run: |
          npm ci
          npm run build
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: computer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/uniac-ai/agentcomputer/computer:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/uniac-ai/AgentComputer
            org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/uniac-ai/agentcomputer/computer
          subject-digest: ${{ steps.computer.outputs.digest }}
          push-to-registry: true
      - id: service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/uniac-ai/agentcomputer/service:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/uniac-ai/AgentComputer
            org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/uniac-ai/agentcomputer/service
          subject-digest: ${{ steps.service.outputs.digest }}
          push-to-registry: true

  # The Mac app, built unsigned, signed ad hoc as the Mac job builds it, and checked as it checks
  # it; then zipped as the archive its signing takes, with the app at the archive's top and no
  # AppleDouble files, which would break its seal where it is unpacked off a Mac.
  mac:
    needs: build
    # Apple silicon, as the Node the app carries is.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.93.1"
      # Cua Driver, asked its version, sends no telemetry and checks for no update.
      DO_NOT_TRACK: "1"
      CUA_DRIVER_RS_UPDATE_CHECK: "false"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install
        run: npm ci
      # The assembly fetches Node and Cua Driver and checks each against its pin, its release's
      # sums and, for the driver, GitHub's digest, before anything of it goes in.
      - name: Build the app
        run: npm run app --workspace @agentorg/mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check the app
        run: bash packages/mac/scripts/check-bundle.sh
      - name: Zip it, unsigned
        run: |
          set -euo pipefail
          name="$(node -p "require('./packages/mac/brand.json').name")"
          version="${GITHUB_REF_NAME#v}"
          app="packages/mac/src-tauri/target/release/bundle/macos/$name.app"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          ditto -c -k --norsrc --keepParent "$app" "$name-mac-arm64-$version-unsigned.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app
          path: "*-mac-arm64-*-unsigned.zip"
          if-no-files-found: error

  # After the images and the Mac app, so a release whose app can't be built publishes nothing.
  publish:
    needs: [build, image, mac]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The program first, as before, then the SDK. If one fails, the job fails and the GitHub
      # release waits. Run again, it publishes only what isn't on npm at this version yet.
      - name: Publish the program, then the SDK
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for name in computer computer-sdk; do
            if [ "$(npm view "@agentorg/$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "@agentorg/$name@$version is on npm already."
            else
              npm publish "agentorg-$name-$version.tgz" --access public --provenance --tag "$TAG"
            fi
          done

  # Last, once npm has both packages: the GitHub release, the sign that everything went out. Run
  # again after it is made, it changes nothing of it.
  release:
    needs: [publish, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app
      - id: made
        name: Whether the release is made already
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME is made already: its files stay as they are."
            echo "made=true" >> "$GITHUB_OUTPUT"
          else
            echo "made=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sum what it carries
        if: steps.made.outputs.made == 'false'
        run: |
          sha256sum -- *-mac-arm64-*-unsigned.zip > SHA256SUMS
          cat SHA256SUMS
      - if: steps.made.outputs.made == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *-mac-arm64-*-unsigned.zip
            SHA256SUMS
      - name: Make the release
        if: steps.made.outputs.made == 'false'
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
            --title "${GITHUB_REF_NAME#v}" --notes-file "release-notes/$GITHUB_REF_NAME.md" \
            *-mac-arm64-*-unsigned.zip SHA256SUMS
