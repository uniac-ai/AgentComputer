name: Mac app

# The Mac app's own side, on a Mac, which the Linux checks can't build: its Rust tests, and its
# bundle, built with this repository's program and then checked file by file. It runs when the app,
# its window's page, the program it carries or the lockfile changes. Nothing here needs a privacy grant, a person or a signing identity: the bundle
# is signed ad hoc, and nothing of it is registered or opened. What needs those is checked on a Mac
# by hand.

on:
  pull_request:
    paths:
      - "packages/mac/**"
      - "packages/mac-window/**"
      - "packages/base/**"
      - "packages/browser/**"
      - "packages/containers/**"
      - "packages/contract/**"
      - "packages/exec/**"
      - "packages/inside/**"
      - "packages/provider/**"
      - "packages/screen/**"
      - "packages/sdk/**"
      - "packages/this-computer/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mac.yml"
  push:
    branches: [main]
    paths:
      - "packages/mac/**"
      - "packages/mac-window/**"
      - "packages/base/**"
      - "packages/browser/**"
      - "packages/containers/**"
      - "packages/contract/**"
      - "packages/exec/**"
      - "packages/inside/**"
      - "packages/provider/**"
      - "packages/screen/**"
      - "packages/sdk/**"
      - "packages/this-computer/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mac.yml"

permissions:
  contents: read

jobs:
  app:
    # Apple silicon, as the Node the bundle carries is.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # The Rust the app is built with on the Mac it is tried on.
      RUSTUP_TOOLCHAIN: "1.93.1"
      # Cua Driver, asked its version, sends no telemetry and checks for no update, as the app
      # starts it.
      DO_NOT_TRACK: "1"
      CUA_DRIVER_RS_UPDATE_CHECK: "false"
      # As `tauri build` sets it from minimumSystemVersion, so the tests' build is reused there.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install
        run: npm ci
      - name: The app's Rust tests
        working-directory: packages/mac/src-tauri
        run: cargo test --release --locked
      # The assembly fetches Node and Cua Driver and checks each against its pin, its release's
      # sums and, for the driver, GitHub's digest, before anything of it goes in.
      - name: Build the app
        run: npm run app --workspace @agentorg/mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The same check the release run makes of the app it builds.
      - name: Check the bundle
        run: bash packages/mac/scripts/check-bundle.sh
