openapi: 3.1.0
info:
  title: AgentComputer
  version: 0.0.19
  description: >-
    Computers for agents. This file is the source of truth: the HTTP API, the MCP control tools and
    the SDK are all generated from it. An operation with `x-mcp-tool` is also an MCP tool of that
    name.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:7878
    description: The default address of a service on this machine.
security:
  - controlToken: []
paths:
  /v1/info:
    get:
      operationId: getInfo
      x-mcp-tool: service_info
      summary: >-
        What this service offers: this computer, the kinds of computer it can make, and the
        browsers that can go with each, every one ready or not and why.
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/connection:
    get:
      operationId: getConnection
      summary: >-
        Who is connected to the service: each client that holds a WebSocket open at this same
        path, with the control token in its Authorization header and its name as `?name=`. It
        carries nothing either way, and one that stops answering the service's pings is dropped.
      responses:
        "200":
          description: Who is connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/setup:
    get:
      operationId: getSetup
      summary: >-
        For each part of the service's machine an agent can use, the person's switch and what it
        still needs before it works, read afresh each time.
      responses:
        "200":
          description: Each part.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/setup/{capability}:
    parameters:
      - name: capability
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Switch" }
    put:
      operationId: setSetup
      summary: >-
        Set a part's switch, which lasts across restarts. Turning it on, or on again, also takes
        the steps that ask for what it still needs, on the service's machine, macOS only: for the
        screen, Cua Driver's own grant of Screen Recording and Accessibility, its app started
        first; for the browser, Chrome, or Edge where there is no Chrome, opened at its
        remote-debugging switch. It answers once they have started, with each part then; what
        the person does next is read afresh later. That a browser opens at its switch's address
        this way is yet to be tried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: ["on"]
              properties:
                "on": { type: boolean }
      responses:
        "200":
          description: Set, and its steps started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/acting:
    get:
      operationId: getActing
      summary: >-
        Who is acting now on the computers attached to this machine, all of them at once: each
        one, on what, and when they last acted there, the most recent first, as each computer's
        presence surface has it. A computer in a container isn't included: its own presence
        surface has it.
      responses:
        "200":
          description: Who is acting now.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Acting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/computers:
    get:
      operationId: listComputers
      x-mcp-tool: computer_list
      summary: List the computers.
      parameters:
        - name: state
          in: query
          description: Only computers in this state.
          schema: { $ref: "#/components/schemas/ComputerState" }
      responses:
        "200":
          description: The computers, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Computer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createComputer
      x-mcp-tool: computer_create
      summary: Create a computer. It answers once the computer is running.
      description: >-
        Meanwhile, once any `copyFrom` copy is done, it is listed by `listComputers` as `starting`,
        with the name and metadata given here, its `reason`, and its image's `progress` where that
        is counted: that is how a caller shows a computer being made before `create` has answered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewComputer" }
      responses:
        "201":
          description: The computer, with its access token, shown only now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedComputer" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/computers/attach:
    post:
      operationId: attachComputer
      x-mcp-tool: computer_attach
      summary: >-
        Attach this computer, the machine the service runs on, whole: its files and commands reach
        all of it, as whoever started the service. Each call attaches it as a computer of its own,
        with its own id and token. Killing one detaches it and removes nothing of the machine's.
        Refused with 409 by a service that other machines can reach, which doesn't offer it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachComputer" }
      responses:
        "201":
          description: It, with its access token, shown only now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedComputer" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/computers/{computerID}:
    parameters:
      - $ref: "#/components/parameters/computerID"
    get:
      operationId: getComputer
      x-mcp-tool: computer_get
      summary: One computer, with how long it has run and the tools it offers.
      responses:
        "200":
          description: The computer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputerDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: killComputer
      x-mcp-tool: computer_kill
      summary: Stop it for good and remove what the service made. A folder someone named stays.
      responses:
        "204": { description: Gone. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >-
            It can't be removed here: a container while Docker doesn't answer, or one made before
            under a service that now only lends this machine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/computers/{computerID}/timeout:
    parameters:
      - $ref: "#/components/parameters/computerID"
    post:
      operationId: setComputerTimeout
      x-mcp-tool: computer_set_timeout
      summary: It now stops this many seconds from now, replacing any earlier timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [timeout]
              properties:
                timeout: { $ref: "#/components/schemas/Timeout" }
      responses:
        "200":
          description: The computer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Computer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/computers/{computerID}/stop:
    parameters:
      - $ref: "#/components/parameters/computerID"
    post:
      operationId: stopComputer
      x-mcp-tool: computer_stop
      summary: Stop what it is running. Its folder and its token stay, and it can start again.
      responses:
        "200":
          description: The computer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Computer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/computers/{computerID}/start:
    parameters:
      - $ref: "#/components/parameters/computerID"
    post:
      operationId: startComputer
      x-mcp-tool: computer_start
      summary: Start a stopped computer again, with the same token and folder.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timeout: { $ref: "#/components/schemas/Timeout" }
      responses:
        "200":
          description: The computer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Computer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/computers/{computerID}/logs:
    parameters:
      - $ref: "#/components/parameters/computerID"
    get:
      operationId: getComputerLogs
      x-mcp-tool: computer_logs
      summary: What its servers wrote, and each request it was sent.
      responses:
        "200":
          description: The logs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputerLogs" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/computers/{computerID}/live:
    parameters:
      - $ref: "#/components/parameters/computerID"
    post:
      operationId: createLiveSession
      x-mcp-tool: computer_live
      summary: >-
        A one-time ticket to watch or operate one of its surfaces live: its terminals, its files,
        its browser, or its load. Open its url as a WebSocket within 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewLiveSession" }
      responses:
        "201":
          description: The ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/live/{liveID}:
    parameters:
      - name: liveID
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      operationId: openLiveSession
      summary: >-
        Open a live session as a WebSocket. The ticket in its path is its authority and works once,
        so it takes no token. A request with an Origin header is refused unless the service was
        told to allow that origin.
      security: []
      responses:
        "101": { description: The socket, in the session's protocol. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "426": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    controlToken:
      type: http
      scheme: bearer
      description: >-
        The control token, for this API and the control MCP endpoint at `/v1/mcp`. A computer's own
        MCP endpoints, at `/v1/computers/{computerID}/mcp/computer` and `.../browser`, take that
        computer's access token and nothing else.
  parameters:
    computerID:
      name: computerID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  responses:
    Error:
      description: It was refused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No valid token.
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
    Access:
      type: string
      enum: [none, read, files, terminal]
      description: >-
        How far it reaches into files and commands, each level containing the one before: `read`
        has about, read, list and search; `files` adds edit; `terminal` adds exec_command,
        write_stdin and list_sessions. Below terminal, the browser's code-running tool is hidden.
    ComputerState:
      type: string
      enum: [starting, running, stopped, failed]
      description: >-
        starting: it is being made, started, or brought back as the service starts. Its `reason`
        says what it waits on, and its `progress` how far that has come, where it counts. Its
        endpoints and live sessions are refused with 409 and that `reason` until it is running.
        `create` and `start` answer once it is running, and it is listed meanwhile; `start` on one
        already starting answers at once.
        failed: it was to be running and isn't, because its browser or container ended by itself,
        or because it couldn't be brought back when the service started. Its `reason` says why,
        and its logs say more. Stop it and start it again.
    Progress:
      type: object
      description: >-
        How far a step that counts its bytes has come: today only fetching a computer's image,
        where Docker is on a socket on the service's machine.
      required: [title, done, total, moved]
      properties:
        title:
          {
            type: string,
            description: 'The step, in words with no numbers: "Downloading its image".',
          }
        done: { type: integer, description: Bytes come so far. }
        total:
          type: [integer, "null"]
          description: >-
            Bytes to come, as far as is known: Docker gives each layer's size as the layer begins,
            so it can grow. Null while nothing is known.
        moved:
          type: string
          format: date-time
          description: >-
            When it last moved: bytes came, or, for an image, a layer was unpacked. When the step
            began, until then.
    Timeout:
      type: integer
      minimum: 1
      description: Seconds from now until the computer stops.
    Metadata:
      type: object
      additionalProperties: { type: string, maxLength: 1024 }
      maxProperties: 64
      description: Your own labels, kept and returned as given.
    NewComputer:
      type: object
      additionalProperties: false
      required: [access]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        access: { $ref: "#/components/schemas/Access" }
        browser:
          type: boolean
          default: false
          description: Whether it has a browser. With access none, it must.
        workspace:
          type: string
          maxLength: 4096
          description: >-
            The full path of a folder that exists, on the service's machine. With none, the service
            makes a folder, which goes when the computer is killed. A folder named here never does.
        copyFrom:
          type: string
          maxLength: 4096
          description: >-
            The full path of a folder on the service's machine. The workspace the service makes
            starts with a copy of what is in it, taken once when the computer is made; the folder
            itself is never mounted or changed. Links are copied as they are, and sockets, pipes
            and devices are left out. Use it instead of workspace; it needs access other than
            none.
        isolation:
          $ref: "#/components/schemas/Isolation"
          description: >-
            How it is isolated, which it keeps for as long as it exists: container, the default.
            One with no isolation is no longer made, and asking for one is refused: attach this
            computer instead.
        timeout: { $ref: "#/components/schemas/Timeout" }
        metadata: { $ref: "#/components/schemas/Metadata" }
    AttachComputer:
      type: object
      additionalProperties: false
      required: [access, workspace]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        access: { $ref: "#/components/schemas/Access" }
        browser:
          oneOf:
            - type: boolean
            - { type: string, const: own }
          default: false
          description: >-
            Its browser. true: a headless one of its own. own: the person's own, Chrome or else
            Edge, signed in, reached through the browser's own attach, which asks the person to
            allow the connection; attaching waits up to 2 minutes for that, and is refused with 409
            if it isn't allowed, or where `info` says it isn't ready. Its agent works only in tabs
            it opens: the person's own tabs are left alone. It is never closed: when the computer
            stops, it is only let go. With access none, the computer must have a browser or the
            screen.
        screen:
          type: boolean
          default: false
          description: >-
            Whether its agent has the machine's screen: to see it, act on it and bring apps
            forward, through Cua Driver, which the person installs and grants Screen Recording and
            Accessibility once. It acts as the person, whatever `access` says. Refused with 409
            where `info` says the screen isn't ready.
        workspace:
          type: string
          maxLength: 4096
          description: >-
            Its work folder: the full path of a folder that exists. Commands and relative paths
            start there and its agent is told to work there, but nothing keeps its files inside
            it. Detaching never removes it.
        timeout: { $ref: "#/components/schemas/Timeout" }
        metadata: { $ref: "#/components/schemas/Metadata" }
    Isolation:
      type: string
      enum: [none, container]
      description: >-
        none: processes of whoever started the service, which only this computer has now; a
        computer made with no isolation before can't start again. container: a container of its
        own, which needs Docker on the service's machine.
    Endpoints:
      type: object
      required: [computer, browser, screen]
      description: MCP over Streamable HTTP, each taking the computer's access token as a bearer.
      properties:
        computer: { type: [string, "null"], description: The terminal and files. }
        browser: { type: [string, "null"], description: The browser. }
        screen:
          type: [string, "null"]
          description: >-
            The screen endpoint, or null when this computer was attached without `screen`.
    Computer:
      type: object
      required:
        - computerID
        - name
        - state
        - access
        - isolation
        - attached
        - version
        - browser
        - screen
        - workspace
        - startedAt
        - endAt
        - metadata
        - endpoints
        - reason
        - progress
      properties:
        computerID: { type: string }
        name: { type: string }
        state: { $ref: "#/components/schemas/ComputerState" }
        reason:
          type: [string, "null"]
          description: >-
            In a line a person reads: while it is starting, the step it waits on, with no numbers,
            such as "Its image is being fetched.", "Its container is being started." or "It is
            being started."; while it is failed, why. Null while it is running or stopped.
        progress:
          description: >-
            While it is starting, how far its step has come, where the step counts its bytes; null
            otherwise.
          oneOf:
            - $ref: "#/components/schemas/Progress"
            - type: "null"
        access: { $ref: "#/components/schemas/Access" }
        isolation:
          $ref: "#/components/schemas/Isolation"
          description: The isolation it was made in. It is never run in another.
        attached:
          type: boolean
          description: >-
            Whether it is this computer, attached rather than made: the service's machine, whole,
            acting as whoever started the service, with no isolation. False with isolation none
            marks a computer made with no isolation by an earlier version, which can't start
            again; its workspace is kept.
        version:
          type: [string, "null"]
          description: >-
            The version of the program it ran at its last start. For this computer it is the
            service's `version` (see `getInfo`). In a container it is the version inside its
            image, and null for a container made before 0.0.17, which doesn't say, until it is
            made again. It is kept from its last start, so a stopped computer's can be older than
            the service's until it starts. Compare it with the service's to show that a computer
            runs an older program.
        browser:
          oneOf:
            - type: boolean
            - { type: string, const: own }
          description: Its browser, as it was given, or false where it has none.
        screen:
          {
            type: boolean,
            description: "Whether its agent has the screen: only this computer can have one.",
          }
        workspace: { type: [string, "null"] }
        startedAt: { type: string, format: date-time, description: When it last started. }
        endAt:
          type: [string, "null"]
          format: date-time
          description: When it will stop; null if it has no timeout.
        metadata: { $ref: "#/components/schemas/Metadata" }
        endpoints: { $ref: "#/components/schemas/Endpoints" }
    CreatedComputer:
      allOf:
        - $ref: "#/components/schemas/Computer"
        - type: object
          required: [accessToken]
          properties:
            accessToken:
              type: string
              description: Good only for this computer's endpoints. Shown only now.
    ComputerDetail:
      allOf:
        - $ref: "#/components/schemas/Computer"
        - type: object
          required: [uptimeSeconds, tools, surfaces]
          properties:
            uptimeSeconds: { type: integer }
            surfaces:
              type: array
              description: What can be opened live while it runs.
              items: { $ref: "#/components/schemas/SurfaceInfo" }
            tools:
              type: object
              required: [computer, browser, screen]
              properties:
                computer: { type: array, items: { type: string } }
                browser: { type: array, items: { type: string } }
                screen: { type: array, items: { type: string } }
    Surface:
      type: string
      enum: [terminal, files, browser, load, presence, screen]
      description: >-
        terminal: every terminal on it, the agent's commands and a person's shells alike, on one
        socket in terminal@1: text messages are TerminalEvent one way and TerminalInput the other.
        Watching reads them all; operating also opens a shell, types into any of them, the agent's
        included, sizes and stops them. files: its workspace's files, in files@1:
        text messages are FilesRequest one way and FilesAnswer the other, and a file's bytes travel
        as binary messages of at most 1,048,576 bytes. Watching lists and reads; operating also
        writes, which a computer with read access doesn't offer. browser: its browser, in
        screencast@1: binary messages are JPEG frames of the page shown, text messages are
        ScreencastEvent one way and ScreencastInput the other. Nobody waits for anybody: the
        agent's tools and a person's input act on the same browser at once. The page shown is each
        socket's own. A socket is shown each new tab as it opens, until it sends a tab input to
        show or open one; from then its page changes only when that page closes. load: how busy
        it is, in metrics@1, to watch only: a LoadReading every two seconds while a socket is
        open, the first two seconds after the first socket opens, and the last one at once to a
        socket that opens later. One that can't be taken is left out, and a socket that hasn't
        read the one before is not sent the next. Nothing is read while nobody watches or asks.
        presence: who is acting on it now, in presence@1, to watch only: a PresenceEvent when the
        socket opens, and another each time someone starts or stops acting on something. screen:
        the machine's screen, for this computer attached with it, in screen@1: binary messages are
        PNG frames of the whole screen, at most 1,280 pixels on their longest side, text messages
        are ScreenEvent one way and ScreenInput the other. The screen is taken twice a second
        while a socket is open, and a frame is sent only when the picture changed, so a socket is
        sent the last one when it opens and nothing more while the screen is still. A socket with
        more than 4 MiB still to be sent to it is sent nothing until it catches up.
    LiveMode:
      type: string
      enum: [watch, operate]
      description: >-
        In watch you see and don't act: what you send is dropped, except that a files socket may
        still ask to list, to read and for what changed.
    SurfaceInfo:
      type: object
      required: [surface, protocol, operate]
      properties:
        surface: { $ref: "#/components/schemas/Surface" }
        protocol: { type: string }
        operate: { type: boolean, description: Whether it can be operated, not only watched. }
        unavailable: { type: string, description: "Why it can't be opened now, if it can't." }
    NewLiveSession:
      type: object
      additionalProperties: false
      required: [surface]
      properties:
        surface: { $ref: "#/components/schemas/Surface" }
        mode:
          allOf: [{ $ref: "#/components/schemas/LiveMode" }]
          default: watch
    LiveSession:
      type: object
      required: [url, protocol, surface, mode, expiresAt]
      properties:
        url: { type: string, description: The WebSocket to open, once. }
        protocol: { type: string }
        surface: { $ref: "#/components/schemas/Surface" }
        mode: { $ref: "#/components/schemas/LiveMode" }
        expiresAt: { type: string, format: date-time }
    ScreencastEvent:
      description: What the service sends on a screencast@1 socket, as JSON text.
      oneOf:
        - type: object
          description: >-
            The open tabs, and which one this socket's frames are of, sent again whenever a tab
            opens, closes, navigates or changes its title, or the socket is shown another.
          required: [type, tabs, shown]
          properties:
            type: { const: tabs }
            tabs:
              type: array
              items:
                type: object
                required: [id, url, title]
                properties:
                  id: { type: integer }
                  url: { type: string }
                  title: { type: string }
            shown: { type: [integer, "null"] }
        - type: object
          description: The size of the page in the frames, in the coordinates input uses.
          required: [type, width, height]
          properties:
            type: { const: viewport }
            width: { type: integer }
            height: { type: integer }
        - type: object
          description: >-
            A dialog the page opened, which blocks it until it's answered, or that it closed.
          required: [type, open]
          properties:
            type: { const: dialog }
            open: { type: boolean }
            kind: { type: string, enum: [alert, confirm, prompt, beforeunload] }
            message: { type: string }
            defaultValue: { type: string }
        - type: object
          description: The page asked for files, or stopped asking.
          required: [type, open]
          properties:
            type: { const: file-chooser }
            open: { type: boolean }
            multiple: { type: boolean }
        - type: object
          description: >-
            A list to choose from, after a press on one: a page's own list isn't in the frames.
          required: [type, multiple, options]
          properties:
            type: { const: choice }
            multiple: { type: boolean }
            options:
              type: array
              items:
                type: object
                required: [value, label, selected]
                properties:
                  value: { type: string }
                  label: { type: string }
                  selected: { type: boolean }
    ScreencastInput:
      description: >-
        What an operate socket sends on screencast@1, as JSON text. A watch socket's is dropped.
      oneOf:
        - type: object
          required: [type, action, x, y]
          properties:
            type: { const: mouse }
            action: { type: string, enum: [move, down, up, wheel] }
            x: { type: number }
            y: { type: number }
            button: { type: string, enum: [left, right, middle] }
            deltaX: { type: number }
            deltaY: { type: number }
        - type: object
          required: [type, action, key]
          properties:
            type: { const: key }
            action: { type: string, enum: [down, up] }
            key: { type: string, description: A key name, as Playwright's keyboard takes it. }
        - type: object
          required: [type, text]
          properties:
            type: { const: text }
            text: { type: string }
        - type: object
          required: [type, accept]
          properties:
            type: { const: dialog }
            accept: { type: boolean }
            text: { type: string }
        - type: object
          description: The files for an open file chooser. None cancels it.
          required: [type, files]
          properties:
            type: { const: files }
            files:
              type: array
              items:
                type: object
                required: [name, data]
                properties:
                  name: { type: string }
                  mimeType: { type: string }
                  data: { type: string, description: Base64. }
        - type: object
          required: [type, values]
          properties:
            type: { const: choice }
            values: { type: array, items: { type: string } }
        - type: object
          description: >-
            Show this socket another tab, open one and show it, or close one. After show or open,
            the socket's page is its own and no longer follows new tabs.
          required: [type, action]
          properties:
            type: { const: tab }
            action: { type: string, enum: [show, open, close] }
            id: { type: integer }
            url: { type: string }
        - type: object
          required: [type, to]
          properties:
            type: { const: navigate }
            to: { type: string, description: "A URL, or back, forward or reload." }
    ScreenEvent:
      description: What the service sends on a screen@1 socket, as JSON text.
      oneOf:
        - type: object
          description: >-
            The size of the frames that follow, in pixels: the points a ScreenInput is aimed at.
            Sent before the first frame, and again before one whose size is different.
          required: [type, width, height]
          properties:
            type: { const: size }
            width: { type: integer }
            height: { type: integer }
        - type: object
          description: >-
            What this socket sent wasn't done, and why, in words for a person: Cua Driver's own,
            where it refused. Sent only to the operate socket that sent it. What was done is seen in
            the frames.
          required: [type, message]
          properties:
            type: { const: refused }
            message: { type: string }
    ScreenInput:
      description: >-
        What an operate socket sends on screen@1, as JSON text, no message over 65,536 bytes: a
        larger one closes the socket. Each is done in order, through Cua Driver, as the person. A
        point is in pixels of the frames, as the last size says, scaled to the screen; keys and
        text go to the window in front. What isn't done is answered with refused, and why: what
        Cua Driver refuses, what is none of these, and what is sent while 32 are still waiting.
        Binary messages, and whatever a watch socket sends, are dropped.
      oneOf:
        - type: object
          description: >-
            A click, double click or right click at x and y; a drag from x and y to to_x and to_y;
            or a scroll at x and y in direction, by amount steps, 3 if left out.
          required: [type, action, x, y]
          properties:
            type: { const: mouse }
            action: { type: string, enum: [click, double_click, right_click, drag, scroll] }
            x: { type: number }
            y: { type: number }
            to_x: { type: number }
            to_y: { type: number }
            direction: { type: string, enum: [up, down, left, right] }
            amount: { type: integer, minimum: 1 }
        - type: object
          description: >-
            One key, or keys pressed together, by Cua Driver's names: enter, tab, escape, space,
            backspace, delete, home, end, pageup, pagedown, up, down, left, right, f1 to f12 and
            single characters, with modifiers such as ctrl, alt, shift and cmd: ["enter"],
            ["ctrl", "c"].
          required: [type, keys]
          properties:
            type: { const: key }
            keys: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        - type: object
          required: [type, text]
          properties:
            type: { const: text }
            text: { type: string, minLength: 1 }
    TerminalEvent:
      description: >-
        What the service sends on a terminal@1 socket, as JSON text, no message over 65,536 bytes.
        A terminal is a command the agent started or a shell a person opened; its id is the
        session id the agent's tools use. A new socket is first sent, for each terminal already
        there, the oldest first, its start, the end of what it wrote (its last 65,536 characters),
        and its exit if it has ended; then each event as it happens, with nothing to mark where
        the first ends. The last 64 that ended are among those already there, and one that leaves
        that list is not told. A character here is a UTF-16 unit. A socket with more than 4 MiB
        still to be sent to it is closed, with no close frame (1006): one that has stopped
        reading, or one that is reading while a terminal writes tens of megabytes at once. It
        isn't an error. Opened again, it is sent every terminal afresh, with the last 65,536
        characters each wrote, in place of whatever it held.
      oneOf:
        - type: object
          description: A terminal began.
          required: [type, id, by, cmd, workdir, tty, at]
          properties:
            type: { const: start }
            id: { type: string }
            by:
              type: string
              enum: [agent, person]
              description: "The way in it came: agent through a tool, person through this surface."
            cmd: { type: string, description: "Its command, the first 8,000 characters of it." }
            workdir: { type: string, description: "Its folder, the first 2,000 characters of it." }
            tty:
              type: boolean
              description: >-
                Whether it is on a terminal device, as a person's shell is. One that isn't, as the
                agent's commands aren't, echoes nothing typed into it and wants a line feed for
                Enter. Nothing tells the size of one that is.
            at: { type: string, format: date-time }
        - type: object
          description: >-
            What it wrote, as it writes: 10,000 characters a message at most, a longer piece as
            several. A command that left something running can still write after its exit.
          required: [type, id, text]
          properties:
            type: { const: output }
            id: { type: string }
            stream:
              type: string
              enum: [stdout, stderr]
              description: >-
                Left out for one on a terminal device, which has one stream, and in what a new
                socket is first sent, where the two are one text.
            text: { type: string }
        - type: object
          description: It ended.
          required: [type, id, exitCode, at]
          properties:
            type: { const: exit }
            id: { type: string }
            exitCode: { type: integer }
            at: { type: string, format: date-time }
        - type: object
          description: >-
            What this socket asked wasn't done, and why, in words for a person. Sent only to the
            operate socket that asked. What was done is answered by its event, or by nothing.
          required: [type, message]
          properties:
            type: { const: refused }
            message: { type: string }
    TerminalInput:
      description: >-
        What an operate socket sends on terminal@1, as JSON text. One that can't be done, or that
        is none of these, is answered with refused. What a watch socket sends is dropped. A
        message over 65,536 bytes closes the socket, so a long text goes as several inputs.
      oneOf:
        - type: object
          description: >-
            Start a shell of your own in the workspace, as its user, on a terminal device of this
            size. It arrives as a start like any other. Refused past the 64 terminals that may
            run at once, and where the service has no node-pty.
          required: [type, columns, rows]
          properties:
            type: { const: open }
            columns: { type: integer, minimum: 1, maximum: 1000 }
            rows: { type: integer, minimum: 1, maximum: 1000 }
        - type: object
          description: >-
            Type into a running terminal, the agent's included. In a command, Ctrl-C (U+0003)
            interrupts it and Ctrl-D (U+0004) ends its input. Refused for one that has ended or
            isn't there.
          required: [type, id, text]
          properties:
            type: { const: input }
            id: { type: string }
            text: { type: string }
        - type: object
          description: >-
            Give a terminal on a terminal device a new size, which is the size for everyone
            looking at it. Refused for a command, which has none, and for one that has ended or
            isn't there.
          required: [type, id, columns, rows]
          properties:
            type: { const: resize }
            id: { type: string }
            columns: { type: integer, minimum: 1, maximum: 1000 }
            rows: { type: integer, minimum: 1, maximum: 1000 }
        - type: object
          description: >-
            End a terminal: an interrupt for a command, a hangup for a shell, then a kill a second
            later. Its exit is the answer. One that has ended is left as it is, and one that isn't
            there is refused.
          required: [type, id]
          properties:
            type: { const: stop }
            id: { type: string }
    LoadReading:
      description: >-
        What the service sends on a metrics@1 socket, as JSON text. What a socket sends is
        dropped.
      type: object
      required: [type, scope, cpuUsedPct, memUsed, memTotal, diskUsed, diskTotal]
      properties:
        type: { const: reading }
        scope:
          type: string
          enum: [computer, machine]
          description: >-
            Whose numbers these are. computer: the computer's own, as a container's are. machine:
            the whole machine's, as this computer's are, which it shares with whatever else runs
            there; and a container's where it can't read its own.
        cpuUsedPct:
          type: number
          minimum: 0
          maximum: 100
          description: Of all the machine's CPUs, since the reading before. One decimal.
        memUsed: { type: integer, description: Bytes in use. }
        memTotal: { type: integer, description: "Bytes the machine has: no computer has a limit." }
        diskUsed:
          type: integer
          description: >-
            Bytes used on the volume its workspace is on, or its own folder where it has no
            workspace. The volume's, not the workspace's own size.
        diskTotal: { type: integer, description: Bytes on that volume. }
    Switch:
      type: string
      enum: [terminal, files, screen, browser]
      description: >-
        A part of the service's machine an agent can use: its terminal, its files, its screen, and
        the person's own browser.
    Need:
      type: object
      required: [need, state]
      properties:
        need:
          type: string
          enum: [install, screen-recording, accessibility, chrome, edge, named]
          description: >-
            install: what the part works through isn't installed: Cua Driver, or both Chrome and
            Edge. screen-recording and accessibility: Cua Driver's two grants. chrome, edge and
            named: a browser here and its remote-debugging switch.
        name: { type: string, description: "A browser's name: Chrome, Edge, or the browser." }
        holder:
          type: string
          description: >-
            For a grant, whose it is, as System Settings lists it: the app Cua Driver is the program
            of, such as CuaDriver.
        state:
          type: string
          enum: [missing, granted, not-granted, unknown, "on", "off"]
          description: unknown is that it can't be read now.
    Setup:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          description: terminal, files, screen and browser, in that order.
          items:
            type: object
            required: [capability, "on", needs]
            properties:
              capability: { $ref: "#/components/schemas/Switch" }
              "on":
                type: boolean
                description: >-
                  The person's switch. Off, agents can't use the part: its tools refuse, saying the
                  person turned it off, and `info` says so. A service started with `--lend` starts
                  with every one off; any other, with every one on.
              needs:
                type: array
                description: >-
                  While anything the part needs isn't right yet, each such item with its state; none
                  once all are. The terminal and files need nothing. The screen needs Cua Driver,
                  and on macOS its two grants. The browser needs Chrome or Edge with its switch on:
                  while none is on, each one here, off.
                items: { $ref: "#/components/schemas/Need" }
    Connection:
      type: object
      required: [connected, clients]
      properties:
        connected: { type: boolean, description: Whether any client holds a connection now. }
        clients:
          type: array
          description: Each client holding one, the earliest first.
          items:
            type: object
            required: [name, since, local]
            properties:
              name:
                type: string
                description: "The name it gave, its first 100 characters, or empty: such as AgentOrg 0.0.15."
              since: { type: string, format: date-time }
              local:
                type: boolean
                description: >-
                  Whether it connects from this machine, by the address it connects from. False
                  behind --tls-proxy, where every client comes from the proxy.
    Acting:
      description: >-
        Someone who acted on a computer in the last 10 seconds. The person acts in a live view at
        operate: opening a shell, typing into or stopping a terminal, writing a file, any input to
        the browser but moving the pointer, or any input to the screen that Cua Driver did. Watching
        is not acting, and the person's own use of the screen, outside a live view, can't be seen.
        The agent acts by calling its endpoints: starting a command or typing into one (waiting on
        its output is not acting), any file tool, reads among them, any browser tool that is
        answered, and any screen tool. Computers attached to the same machine share its files and
        its screen: each is shown the person and the other computers' agents acting on them, by
        name.
      type: object
      required: [who, capability, at]
      properties:
        who: { type: string, enum: [person, agent] }
        name: { type: string, description: The agent's name, which is its computer's. }
        capability: { type: string, enum: [terminal, files, browser, screen] }
        terminal: { type: string, description: "Which terminal, by its id; only for a terminal." }
        at:
          type: string
          format: date-time
          description: >-
            When it last acted there, as of this message: one who goes on acting is sent again only
            when someone starts or stops.
    PresenceEvent:
      description: >-
        What the service sends on a presence@1 socket, as JSON text: the whole list of everyone
        acting now, the most recent first, empty where nobody is. It is sent when the socket opens
        and each time someone starts acting on something, or stops: 10 seconds after they last
        acted there. Nothing is refused by it. What a socket sends is dropped.
      type: object
      required: [type, acting]
      properties:
        type: { const: presence }
        acting:
          type: array
          items: { $ref: "#/components/schemas/Acting" }
    FilesRequest:
      description: >-
        What a socket sends on files@1, as JSON text. Each has an id of its own choosing, which the
        answer repeats; answers come as they are ready, in any order, and ids aren't checked for
        repeats. A request still unanswered when the socket closes gets no answer. A path is from
        the workspace, with / between its parts, or absolute inside it, and nothing outside the
        workspace is reached. A binary message that follows no write closes the socket, and so does
        any message over 1,048,576 bytes.
      oneOf:
        - type: object
          description: >-
            A folder's entries, folders first, the first thousand. There is no asking for the rest.
          required: [type, id]
          properties:
            type: { const: list }
            id: { type: string, minLength: 1, maxLength: 64 }
            path: { type: string, description: "The workspace itself, if left out." }
        - type: object
          description: >-
            Bytes of a file from an offset. The answer is a data message and then one binary
            message, the bytes: fewer than asked for at the file's end, and none past it.
          required: [type, id, path, offset, length]
          properties:
            type: { const: read }
            id: { type: string, minLength: 1, maxLength: 64 }
            path: { type: string }
            offset: { type: integer, minimum: 0 }
            length: { type: integer, minimum: 1, maximum: 1048576 }
        - type: object
          description: >-
            The files modified after a time, in whole milliseconds: the newest thousand, the newest
            first. It skips what .gitignore files ignore, .git, node_modules and links, and a file
            that was removed isn't one of them. Each one asked walks the workspace once, and a
            computer walks for one at a time. Nothing is walked that wasn't asked for.
          required: [type, id, since]
          properties:
            type: { const: changed }
            id: { type: string, minLength: 1, maxLength: 64 }
            since: { type: string, format: date-time }
        - type: object
          description: >-
            The next part of a file, on an operate socket, followed by one binary message of
            exactly length bytes, with no message between them. The part at offset 0 starts the
            file, or starts it again, and each one after starts where the last ended. Nothing is at
            the path until the part marked last, which puts the file there whole, over any that was
            there, and is answered with written. Only that part, and a part that is refused, is
            answered. It makes no folders. A file not finished when the socket closes is given up.
          required: [type, id, path, offset, length, last]
          properties:
            type: { const: write }
            id: { type: string, minLength: 1, maxLength: 64 }
            path: { type: string }
            offset: { type: integer, minimum: 0 }
            length: { type: integer, minimum: 0, maximum: 1048576 }
            last: { type: boolean }
    FilesAnswer:
      description: >-
        What the service sends on files@1, as JSON text, each with the id it answers. Nothing comes
        between a data message and its bytes.
      oneOf:
        - type: object
          required: [type, id, path, entries, more]
          properties:
            type: { const: entries }
            id: { type: string }
            workspace:
              type: string
              description: >-
                What the workspace is called: its folder's own name, and nothing of where it is.
                It comes with every entries answer, whichever folder was asked for, so that with
                path it names the folder. A computer in a container made before `workspace` was
                added sends none, and there path alone names the folder. It is `workspace` for a
                workspace the service made, and empty for one at the top of a disk.
            path:
              type: string
              description: "The folder as it was asked for: `.` for the workspace itself."
            entries:
              type: array
              items:
                type: object
                description: A link is not followed, and its size and date are its own.
                required: [name, kind, size, modifiedAt]
                properties:
                  name: { type: string }
                  kind: { type: string, enum: [file, folder, link] }
                  size: { type: integer }
                  modifiedAt: { type: string, format: date-time }
            more: { type: boolean, description: Whether the folder has more than these. }
        - type: object
          description: What the binary message after it is, and the file's whole size and date.
          required: [type, id, path, offset, length, size, modifiedAt]
          properties:
            type: { const: data }
            id: { type: string }
            path: { type: string }
            offset: { type: integer }
            length: { type: integer, description: How many bytes follow. }
            size: { type: integer }
            modifiedAt: { type: string, format: date-time }
        - type: object
          required: [type, id, since, changes, more]
          properties:
            type: { const: changes }
            id: { type: string }
            since: { type: string, format: date-time }
            changes:
              type: array
              items:
                type: object
                required: [path, size, modifiedAt]
                properties:
                  path: { type: string }
                  size: { type: integer }
                  modifiedAt: { type: string, format: date-time }
            more: { type: boolean, description: Whether more than these changed. }
        - type: object
          description: The file is in place.
          required: [type, id, path, size]
          properties:
            type: { const: written }
            id: { type: string }
            path: { type: string }
            size: { type: integer }
        - type: object
          description: >-
            It wasn't done, and why. The id is empty when what was sent had none to repeat.
          required: [type, id, message]
          properties:
            type: { const: refused }
            id: { type: string }
            message: { type: string }
    ComputerLogs:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          items:
            type: object
            required: [timestamp, line]
            properties:
              timestamp: { type: string, format: date-time }
              line: { type: string }
    Readiness:
      type: object
      required: [ready]
      properties:
        ready: { type: boolean }
        reason:
          type: string
          description: Why it isn't ready, in a line a person reads. Only when it isn't.
    Capability:
      type: string
      enum: [about, terminal, files, screen]
      description: >-
        What a computer offers its agent and the person: what it is, its terminals, its files and
        its screen. This computer's screen is reached through Cua Driver: it is ready where Cua
        Driver is installed, at 0.49.7 or later, and granted Screen Recording and Accessibility,
        and otherwise the reason says what to do.
    CapabilityState:
      allOf:
        - $ref: "#/components/schemas/Readiness"
        - type: object
          required: [capability]
          properties:
            capability: { $ref: "#/components/schemas/Capability" }
    BrowserKind:
      type: string
      enum: [headless, own]
      description: >-
        headless: a headless browser with a profile of its own, beside the computer, which a
        person watches and controls through its live view. own: the person's own browser on the
        service's machine, Chrome or else Edge, signed in, offered for this computer: ready where
        it is open with its remote debugging switched on, which the person does once on its
        inspect page; the browser then asks them to allow each connection. Not ready, the reason
        names the browser and what to do on that machine.
    BrowserState:
      allOf:
        - $ref: "#/components/schemas/Readiness"
        - type: object
          required: [kind]
          properties:
            kind: { $ref: "#/components/schemas/BrowserKind" }
    Offer:
      allOf:
        - $ref: "#/components/schemas/Readiness"
        - type: object
          required: [capabilities, browsers]
          properties:
            capabilities:
              type: array
              description: What such a computer has, each ready or not.
              items: { $ref: "#/components/schemas/CapabilityState" }
            browsers:
              type: array
              description: The browsers that can go with it, each ready or not.
              items: { $ref: "#/components/schemas/BrowserState" }
    MadeKind:
      allOf:
        - $ref: "#/components/schemas/Offer"
        - type: object
          required: [isolation]
          properties:
            isolation: { $ref: "#/components/schemas/Isolation" }
    ServiceInfo:
      type: object
      required: [version, thisComputer, made]
      properties:
        version: { type: string }
        thisComputer:
          $ref: "#/components/schemas/Offer"
          description: >-
            This computer, the machine the service runs on, attached whole, as whoever started the
            service. It can be attached while ready: only where the service listens on loopback,
            with no proxy in front and no public address. Elsewhere it isn't offered, and one
            attached before is refused at start.
        made:
          type: array
          description: >-
            Each kind of computer it makes, ready while it can be made now. A container is ready
            while Docker answers on the service's machine: asked for a second here and for ten when
            one is made, so one that is slow can be not ready here and still be made.
          items: { $ref: "#/components/schemas/MadeKind" }
